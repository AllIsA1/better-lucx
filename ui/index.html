<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Better LucX</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="title">Own links</h1>
      <p class="muted" data-i18n="intro"></p>

      <section>
        <h2 data-i18n="pick"></h2>
        <div class="row">
          <input id="search" type="search" autocomplete="off" />
          <button id="searchBtn" data-i18n="find"></button>
        </div>
        <p id="clientsHint" class="muted"></p>
        <ul id="clients" class="list"></ul>
      </section>

      <section id="editor" hidden>
        <h2 id="editorTitle"></h2>
        <p id="subline" class="muted"></p>
        <table id="links">
          <thead>
            <tr>
              <th data-i18n="colOn"></th>
              <th data-i18n="colName"></th>
              <th data-i18n="colLink"></th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="empty" class="muted" data-i18n="empty"></p>

        <h3 data-i18n="addTitle"></h3>
        <textarea id="text" rows="5" spellcheck="false"></textarea>
        <div class="row">
          <input id="name" type="text" maxlength="100" />
          <button id="add" class="primary" data-i18n="add"></button>
        </div>
        <ul id="rejected" class="rejected"></ul>
      </section>

      <p id="message" class="message" role="status"></p>
    </main>
    <script src="lucx-ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
